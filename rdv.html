<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="assets/logo.jpg"><link rel="apple-touch-icon" href="assets/logo.jpg">
<title>Rendez-vous · El Wakil Immobilier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/app.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
</head>
<body>
<div id="page">
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Rendez-vous</h1>
      <p class="text-sm text-slate-500 mt-1">Toutes les visites programmées par les commerciaux et réalisées par l'équipe terrain.</p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <button id="export" data-perm="rdv.export" class="btn btn-secondary"><i data-lucide="download"></i> Exporter</button>
      <button id="new" data-perm="rdv.create" class="btn btn-primary hidden sm:inline-flex"><i data-lucide="plus"></i> Nouveau rendez-vous</button>
    </div>
  </div>

  <div id="stats" class="mt-6 grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></div>

  <div class="card mt-6 overflow-hidden">
    <div class="p-4 border-b border-slate-100 flex flex-wrap items-center gap-2">
      <div class="relative flex-1 min-w-[180px]">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input id="q" class="field !pl-9" placeholder="Rechercher un bien, une commune…" enterkeyhint="search">
      </div>
      <button id="ftoggle" class="m-only btn btn-secondary !px-3 relative"><i data-lucide="sliders-horizontal"></i><span id="fcount" class="hidden absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] rounded-full bg-brand-500 text-night-900 text-[10px] font-bold items-center justify-center px-1"></span></button>
      <div id="filt" class="hidden sm:contents w-full grid-cols-2 gap-2">
        <select id="fMonth" class="field sm:!w-auto"></select>
        <select id="fAgent" class="field sm:!w-auto"></select>
        <select id="fTerrain" class="field sm:!w-auto"></select>
        <select id="fType" class="field sm:!w-auto"></select>
        <select id="fWil" class="field sm:!w-auto"></select>
        <button id="reset" class="btn btn-ghost"><i data-lucide="rotate-ccw"></i> Réinitialiser</button>
      </div>
    </div>
    <div id="mrows" class="m-only divide-y divide-slate-100"></div>
    <div class="d-only overflow-x-auto thin-scroll">
      <table class="tbl">
        <thead><tr>
          <th class="th-sort" data-sort="date">Date <i data-lucide="arrow-down-up" class="inline w-3 h-3 ml-0.5"></i></th>
          <th>Bien</th><th>Wilaya</th><th>Commercial</th><th>Équipe terrain</th><th>Paiement</th>
          <th class="num th-sort" data-sort="revenu">Revenu <i data-lucide="arrow-down-up" class="inline w-3 h-3 ml-0.5"></i></th><th class="w-10"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="px-4 py-3 border-t border-slate-100 flex items-center justify-between text-sm text-slate-500">
      <span id="pageInfo"></span>
      <div class="flex items-center gap-1" id="pager"></div>
    </div>
  </div>
</div>

<script>
WK.mount({ id: 'rdv', title: 'Rendez-vous', section: 'Opérations', perm: 'rdv.view', help: 'rdv' }, () => {
  const { $, $$, fmt, can, rdvs, team, sum, months, avatar, badge, icon, esc, TYPE_ICON, store, toast, openPanel, closePanel, panelHead, exportCSV, audit, CUR_MONTH, TODAY } = WK;
  const fin = can('finance.view');
  const PER = 15;
  let page = 1, sortKey = 'date', sortDir = -1, highlight = null;

  const allWil = ['Alger', 'Blida', 'Boumerdès', 'Tipaza', 'Médéa', 'Bouira', 'Tizi Ouzou', 'Aïn Defla', 'Chlef', 'Djelfa', 'Oran', 'Mostaganem', 'Mascara', 'Tlemcen', 'Sétif', 'Béjaïa', 'Constantine', 'Jijel', 'Bordj Bou Arreridj', "M'Sila", 'Annaba', 'Skikda', 'El Tarf', 'Tiaret', 'Relizane', 'Saïda', 'Autre'];
  const TYPES = ['Villa', 'Terrain', 'Appartement', 'Maison', 'Local commercial', 'Duplex', 'Carcasse', 'Immeuble', 'Ferme', 'Hangar', 'Autre'];
  const opt = (label, list, val) => `<option value="">${label}</option>` + list.map(x => `<option ${x === val ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const R = () => rdvs();
  $('#fMonth').innerHTML = `<option value="">Tous les mois</option>` + months().slice().reverse().map(m => `<option value="${m}" ${m === CUR_MONTH ? 'selected' : ''}>${fmt.month(m)}</option>`).join('');
  $('#fAgent').innerHTML = opt('Tous les commerciaux', [...new Set(R().map(r => r.agent).filter(Boolean))].sort());
  $('#fTerrain').innerHTML = opt('Toute l\'équipe terrain', [...new Set(R().map(r => r.terrain).filter(Boolean))].sort());
  $('#fType').innerHTML = opt('Tous les types', TYPES);
  $('#fWil').innerHTML = opt('Toutes les wilayas', allWil);
  const params = new URLSearchParams(location.search);
  if (params.get('q')) { $('#q').value = params.get('q'); $('#fMonth').value = ''; }
  if (WK.myAgent()) $('#fAgent').value = WK.myAgent();

  function filtered() {
    const q = $('#q').value.trim().toLowerCase(), m = $('#fMonth').value, a = $('#fAgent').value, t = $('#fTerrain').value, ty = $('#fType').value, w = $('#fWil').value;
    return R().filter(r => (!m || r.date.startsWith(m)) && (!a || r.agent === a) && (!t || r.terrain === t) && (!ty || r.type === ty) && (!w || r.wilaya === w)
      && (!q || (r.lieu + ' ' + r.commune + ' ' + r.remarque + ' ' + r.agent + ' ' + r.terrain + ' ' + r.wilaya).toLowerCase().includes(q)))
      .sort((x, y) => sortKey === 'revenu' ? (x.revenu - y.revenu) * sortDir : (x.date.localeCompare(y.date) || x.id - y.id) * sortDir);
  }

  function stats(L) {
    const card = (label, val, ic, sub = '') => `<div class="card px-5 py-4 flex items-center gap-4"><span class="hidden sm:flex w-10 h-10 rounded-xl bg-slate-50 ring-1 ring-slate-200 text-slate-600 items-center justify-center">${icon(ic, 'w-5 h-5')}</span><div><p class="text-xs font-medium text-slate-500">${label}</p><p class="text-lg font-semibold text-slate-900 tnum">${val} <span class="text-xs font-normal text-slate-400">${sub}</span></p></div></div>`;
    const pending = L.filter(r => !r.revenu).length;
    $('#stats').innerHTML = [
      card('Rendez-vous', fmt.n(L.length), 'calendar-check', 'résultats'),
      fin ? card('Revenus', fmt.da(sum(L, 'revenu')), 'banknote') : card('Communes', new Set(L.map(r => r.commune)).size, 'map-pin', 'différentes'),
      card('Payés par CCP', L.filter(r => r.paiement === 'CCP').length, 'credit-card', 'RDV'),
      card('Revenu non renseigné', pending, 'circle-dashed', pending ? 'à compléter' : ''),
    ].join('');
  }

  function render() {
    const L = filtered();
    stats(L);
    const pages = Math.max(1, Math.ceil(L.length / PER)); page = Math.min(page, pages);
    const P = L.slice((page - 1) * PER, page * PER);
    $('#rows').innerHTML = P.map(r => `
      <tr data-id="${r.id}" class="cursor-pointer ${r.id === highlight ? '!bg-brand-50/60' : ''}">
        <td class="whitespace-nowrap"><p class="font-medium text-slate-800">${fmt.date(r.date)}</p><p class="text-xs text-slate-500">${fmt.weekday(r.date)}</p></td>
        <td><div class="flex items-center gap-3"><span class="w-9 h-9 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">${icon(TYPE_ICON[r.type] || 'map-pin')}</span><div class="min-w-0"><p class="font-medium text-slate-800 truncate max-w-[240px]">${esc(r.commune)}</p><p class="text-xs text-slate-500">${r.type}${r.remarque ? ' · <span class="text-amber-700">' + esc(r.remarque).slice(0, 30) + '</span>' : ''}</p></div></div></td>
        <td class="text-slate-600 whitespace-nowrap">${r.wilaya === 'Autre' ? '<span class="text-slate-400">Non classée</span>' : r.wilaya}</td>
        <td><div class="flex items-center gap-2 whitespace-nowrap">${avatar(r.agent)}<span>${esc(r.agent || '—')}</span></div></td>
        <td><div class="flex items-center gap-2 whitespace-nowrap">${r.terrain ? avatar(r.terrain) + `<span>${esc(r.terrain)}</span>` : '<span class="text-slate-400">Non assigné</span>'}</div></td>
        <td>${r.paiement === 'CCP' ? badge('CCP', 'blue', 'credit-card') : badge('Espèces', 'gray', 'banknote')}</td>
        <td class="num font-medium text-slate-900 whitespace-nowrap">${r.revenu ? fmt.da(r.revenu) : badge('À compléter', 'amber')}</td>
        <td class="text-right"><i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i></td>
      </tr>`).join('') || `<tr><td colspan="8"><div class="py-16 text-center"><span class="mx-auto w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">${icon('search-x', 'w-6 h-6')}</span><p class="mt-3 font-medium text-slate-700">Aucun rendez-vous trouvé</p><p class="text-sm text-slate-500">Essayez d'élargir les filtres.</p></div></td></tr>`;
    $('#mrows').innerHTML = P.map(r => `
      <button data-id="${r.id}" class="w-full text-left flex items-start gap-3 px-4 py-3.5 active:bg-slate-50 ${r.id === highlight ? 'bg-brand-50/60' : ''}">
        <span class="w-11 h-11 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center shrink-0">${icon(TYPE_ICON[r.type] || 'map-pin', 'w-5 h-5')}</span>
        <span class="flex-1 min-w-0">
          <span class="flex items-start justify-between gap-3"><span class="font-medium text-slate-900 truncate">${esc(r.commune)}</span><span class="shrink-0 text-sm font-semibold tnum ${r.revenu ? 'text-slate-900' : 'text-amber-700'}">${r.revenu ? fmt.da(r.revenu) : 'À compléter'}</span></span>
          <span class="block text-xs text-slate-500 mt-0.5">${r.type} · ${r.wilaya === 'Autre' ? 'Non classée' : r.wilaya} · ${fmt.dateShort(r.date)}, ${fmt.weekday(r.date).toLowerCase()}</span>
          <span class="mt-2 flex items-center gap-3 text-xs text-slate-600"><span class="inline-flex items-center gap-1.5">${avatar(r.agent, 'w-5 h-5 text-[9px]')}${esc(r.agent || '—')}</span><span class="inline-flex items-center gap-1.5">${icon('camera', 'w-3.5 h-3.5 text-slate-400')}${esc(r.terrain || '—')}</span>${r.paiement === 'CCP' ? '<span class="ml-auto">' + badge('CCP', 'blue') + '</span>' : ''}</span>
        </span>
      </button>`).join('') || `<div class="py-14 text-center text-sm text-slate-500">Aucun rendez-vous trouvé</div>`;
    const nf = ['fAgent', 'fTerrain', 'fType', 'fWil'].filter(id => $('#' + id).value).length + ($('#fMonth').value !== CUR_MONTH ? 1 : 0);
    $('#fcount').textContent = nf; $('#fcount').classList.toggle('hidden', !nf); $('#fcount').classList.toggle('flex', !!nf);
    $('#pageInfo').innerHTML = L.length ? `<span class="tnum">${(page - 1) * PER + 1}–${Math.min(page * PER, L.length)}</span> sur <span class="tnum font-medium text-slate-700">${L.length}</span> rendez-vous` : '';
    const pb = (p, lbl, dis, on) => `<button data-p="${p}" ${dis ? 'disabled' : ''} class="min-w-[32px] h-8 px-2 rounded-md text-sm ${on ? 'bg-slate-900 text-white' : 'hover:bg-slate-100 text-slate-600'} ${dis ? 'opacity-40 pointer-events-none' : ''}">${lbl}</button>`;
    let nums = []; for (let i = 1; i <= pages; i++) if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i); else if (nums[nums.length - 1] !== '…') nums.push('…');
    $('#pager').innerHTML = pb(page - 1, icon('chevron-left'), page === 1) + nums.map(n => n === '…' ? '<span class="px-1">…</span>' : pb(n, n, false, n === page)).join('') + pb(page + 1, icon('chevron-right'), page === pages);
    WK.refreshIcons();
  }

  ['q', 'fMonth', 'fAgent', 'fTerrain', 'fType', 'fWil'].forEach(id => $('#' + id).addEventListener('input', () => { page = 1; render(); }));
  $('#reset').onclick = () => { $('#q').value = ''; ['fAgent', 'fTerrain', 'fType', 'fWil'].forEach(id => $('#' + id).value = ''); if (WK.myAgent()) $('#fAgent').value = WK.myAgent(); $('#fMonth').value = CUR_MONTH; page = 1; render(); };
  $('#pager').onclick = e => { const b = e.target.closest('[data-p]'); if (b) { page = +b.dataset.p; render(); } };
  $$('[data-sort]').forEach(th => th.onclick = () => { if (sortKey === th.dataset.sort) sortDir *= -1; else { sortKey = th.dataset.sort; sortDir = -1; } render(); });
  $('#mrows').onclick = e => { const b = e.target.closest('[data-id]'); if (b) detail(+b.dataset.id); };
  $('#ftoggle').onclick = () => { const f = $('#filt'); f.classList.toggle('hidden'); f.classList.toggle('grid'); };
  $('#rows').onclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr) detail(+tr.dataset.id); };
  $('#export') && ($('#export').onclick = () => {
    const L = filtered();
    exportCSV(`rendez-vous-${$('#fMonth').value || 'tous'}.csv`, [['Date', 'Bien', 'Type', 'Commune', 'Wilaya', 'Commercial', 'Équipe terrain', 'Paiement', 'Revenu (DA)', 'Remarque'], ...L.map(r => [r.date, r.lieu, r.type, r.commune, r.wilaya, r.agent, r.terrain, r.paiement, r.revenu, r.remarque])]);
    audit('Export', `${L.length} rendez-vous exportés`);
  });

  /* ── Détail ── */
  function detail(id) {
    const r = R().find(x => x.id === id); if (!r) return;
    const row = (k, v) => `<div class="flex justify-between gap-4 py-3 border-b border-slate-100 last:border-0"><dt class="text-sm text-slate-500">${k}</dt><dd class="text-sm font-medium text-slate-800 text-right">${v}</dd></div>`;
    const p = openPanel(`${panelHead('Rendez-vous #' + r.id, fmt.weekday(r.date) + ' ' + fmt.date(r.date))}
      <div class="flex-1 overflow-y-auto p-6">
        <div class="rounded-xl bg-gradient-to-br from-slate-50 to-white ring-1 ring-slate-200 p-5 flex items-center gap-4">
          <span class="w-12 h-12 rounded-xl bg-white ring-1 ring-slate-200 text-brand-700 flex items-center justify-center">${icon(TYPE_ICON[r.type] || 'map-pin', 'w-6 h-6')}</span>
          <div class="flex-1 min-w-0"><p class="font-semibold text-slate-900 text-lg">${esc(r.commune)}</p><p class="text-sm text-slate-500">${r.type} · ${r.wilaya === 'Autre' ? 'Wilaya non classée' : 'Wilaya de ' + r.wilaya}</p></div>
          <div class="text-right"><p class="text-xs text-slate-500">Revenu</p><p class="text-lg font-semibold tnum">${r.revenu ? fmt.da(r.revenu) : '—'}</p></div>
        </div>
        <dl class="mt-5">
          ${row('Saisie d\'origine', `<span class="font-mono text-xs bg-slate-100 rounded px-1.5 py-0.5">${esc(r.lieu)}</span>`)}
          ${row('Commercial', `<span class="inline-flex items-center gap-2">${avatar(r.agent, 'w-6 h-6 text-2xs')}${esc(r.agent || '—')}</span>`)}
          ${row('Équipe terrain', `<span class="inline-flex items-center gap-2">${avatar(r.terrain, 'w-6 h-6 text-2xs')}${esc(r.terrain || 'Non assigné')}</span>`)}
          ${row('Paiement', r.paiement === 'CCP' ? badge('CCP', 'blue', 'credit-card') : badge('Espèces', 'gray', 'banknote'))}
          ${row('Remarque', esc(r.remarque || '—'))}
          ${fin ? row('Prime commercial', fmt.da(WK.settings().primeRdv)) + row('Charge terrain imputée', fmt.da(WK.settings().chargeRdv)) : ''}
        </dl>
        <h4 class="mt-7 text-sm font-semibold text-slate-900">Historique</h4>
        <ol class="mt-3 relative border-l border-slate-200 ml-2 space-y-4 text-sm">
          <li class="pl-5 relative"><span class="absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full bg-brand-500 ring-4 ring-white"></span><p class="text-slate-800"><b>${r.added ? esc(r.by) : 'Import Excel'}</b> a créé le rendez-vous</p><p class="text-xs text-slate-500">${r.added ? 'Aujourd\'hui' : fmt.date(r.date) + ' · synchronisé depuis la feuille'}</p></li>
          ${r.revenu ? `<li class="pl-5 relative"><span class="absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-white"></span><p class="text-slate-800">Revenu encaissé : <b>${fmt.da(r.revenu)}</b></p><p class="text-xs text-slate-500">${fmt.date(r.date)}</p></li>` : ''}
        </ol>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 flex justify-between gap-2">
        <button id="del" data-perm="rdv.delete" class="btn btn-danger ${can('rdv.delete') ? '' : 'is-hidden'}"><i data-lucide="trash-2"></i> Supprimer</button>
        <div class="flex gap-2 ml-auto"><button data-close class="btn btn-secondary">Fermer</button>${can('rdv.edit') ? '<button id="edit" class="btn btn-primary"><i data-lucide="pencil"></i> Modifier</button>' : ''}</div>
      </div>`);
    $('#edit', p) && ($('#edit', p).onclick = () => form(r));
    $('#del', p) && ($('#del', p).onclick = () => {
      if (!confirm('Supprimer ce rendez-vous ? Cette action sera enregistrée dans le journal.')) return;
      store.set('rdvs.deleted', [...store.get('rdvs.deleted', []), r.id]);
      audit('Suppression', `RDV #${r.id} — ${r.lieu}`); closePanel(); render(); toast('Rendez-vous supprimé', 'trash-2');
    });
  }

  /* ── Formulaire ── */
  function form(r) {
    const edit = !!r; r = r || { date: TODAY, type: 'Villa', wilaya: 'Alger', paiement: 'Espèces' };
    const T = team();
    const agents = T.commerciaux.filter(a => a.actif).map(a => a.nom), terr = T.terrain.filter(a => a.actif).map(a => a.nom);
    const communes = [...new Set(R().map(x => x.commune))].sort();
    const p = openPanel(`${panelHead(edit ? 'Modifier le rendez-vous' : 'Nouveau rendez-vous', 'Les champs marqués * sont obligatoires')}
      <form id="f" class="flex-1 overflow-y-auto p-6 space-y-5" novalidate>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="label">Date du rendez-vous *</label><input name="date" type="date" class="field" value="${r.date}" required></div>
          <div><label class="label">Wilaya *</label><select name="wilaya" class="field">${allWil.map(w => `<option ${w === r.wilaya ? 'selected' : ''}>${w}</option>`).join('')}</select></div>
        </div>
        <div><label class="label">Type de bien *</label>
          <div class="grid grid-cols-3 sm:grid-cols-4 gap-2" id="typeGrid">${TYPES.slice(0, 8).map(t => `<label class="cursor-pointer"><input type="radio" name="type" value="${t}" class="peer sr-only" ${t === r.type ? 'checked' : ''}><span class="flex flex-col items-center gap-1.5 rounded-lg border border-slate-200 px-2 py-2.5 text-xs font-medium text-slate-600 peer-checked:border-brand-500 peer-checked:bg-brand-50 peer-checked:text-brand-800 hover:border-slate-300 transition">${icon(TYPE_ICON[t], 'w-5 h-5')}${t}</span></label>`).join('')}</div>
        </div>
        <div><label class="label">Commune / quartier *</label><input name="commune" list="communes" class="field" placeholder="Ex. Bir Khadem" value="${esc(edit ? r.commune : '')}" required><datalist id="communes">${communes.map(c => `<option value="${esc(c)}">`).join('')}</datalist><p class="err hidden text-xs text-red-600 mt-1">Indiquez la commune.</p></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="label">Commercial *</label><select name="agent" class="field" required><option value="">Choisir…</option>${agents.map(a => `<option ${a === (r.agent || WK.myAgent()) ? 'selected' : ''}>${a}</option>`).join('')}</select><p class="err hidden text-xs text-red-600 mt-1">Choisissez un commercial.</p></div>
          <div><label class="label">Équipe terrain *</label><select name="terrain" class="field" required><option value="">Choisir…</option>${terr.map(a => `<option ${a === r.terrain ? 'selected' : ''}>${a}</option>`).join('')}</select><p class="err hidden text-xs text-red-600 mt-1">Choisissez un photographe.</p></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="label">Revenu du rendez-vous</label><div class="relative"><input name="revenu" type="number" min="0" step="1000" class="field pr-12 tnum" placeholder="35000" value="${r.revenu || ''}"><span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">DA</span></div></div>
          <div><label class="label">Mode de paiement</label><div class="seg w-full" id="paySeg">${['Espèces', 'CCP', 'Virement'].map(x => `<button type="button" data-v="${x}" class="flex-1 ${x === r.paiement ? 'on' : ''}">${x}</button>`).join('')}</div></div>
        </div>
        <div><label class="label">Remarque</label><textarea name="remarque" rows="3" class="field" placeholder="Informations utiles pour l'équipe…">${esc(edit ? r.remarque : '')}</textarea></div>
        <div class="rounded-lg bg-slate-50 ring-1 ring-slate-200 p-3 text-xs text-slate-600 flex gap-2.5"><i data-lucide="info" class="w-4 h-4 text-slate-400 shrink-0"></i><span>Les noms sont choisis dans une liste : plus d'erreurs de frappe, et les primes et salaires se recalculent automatiquement.</span></div>
      </form>
      <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-2"><button data-close class="btn btn-secondary">Annuler</button><button id="save" class="btn btn-primary"><i data-lucide="check"></i> ${edit ? 'Enregistrer' : 'Créer le rendez-vous'}</button></div>`);
    let pay = r.paiement;
    WK.seg($('#paySeg', p), v => pay = v);
    $('#save', p).onclick = () => {
      const f = $('#f', p), d = Object.fromEntries(new FormData(f));
      let ok = true;
      ['commune', 'agent', 'terrain'].forEach(k => { const el = f.elements[k], bad = !d[k].trim(); el.classList.toggle('!border-red-400', bad); const e = el.parentElement.querySelector('.err'); e && e.classList.toggle('hidden', !bad); if (bad) ok = false; });
      if (!ok) return;
      const rec = { ...r, date: d.date, type: d.type, wilaya: d.wilaya, commune: d.commune.trim(), lieu: d.commune.trim() + ' ' + d.type.toLowerCase(), agent: d.agent, terrain: d.terrain, revenu: +d.revenu || 0, paiement: pay, remarque: d.remarque.trim(), added: true, by: WK.currentUser().nom };
      const added = store.get('rdvs.added', []);
      if (edit) {
        if (r.added) store.set('rdvs.added', added.map(x => x.id === r.id ? rec : x));
        else { store.set('rdvs.deleted', [...store.get('rdvs.deleted', []), r.id]); rec.id = Date.now() % 1e7; store.set('rdvs.added', [rec, ...added]); }
        audit('Modification', `RDV — ${rec.lieu}`);
      } else {
        rec.id = Date.now() % 1e7; store.set('rdvs.added', [rec, ...added]);
        audit('Création', `RDV — ${rec.commune} (${rec.type}), ${rec.agent} / ${rec.terrain}`);
      }
      highlight = rec.id; closePanel();
      $('#fMonth').value = rec.date.slice(0, 7); sortKey = 'date'; sortDir = -1; page = 1; render();
      toast(edit ? 'Rendez-vous mis à jour' : 'Rendez-vous créé — salaires et statistiques recalculés');
    };
  }
  $('#new') && ($('#new').onclick = () => form());
  render();
  if (params.get('new') && can('rdv.create')) form();
});
</script>
</body>
</html>
