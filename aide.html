<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="assets/logo.jpg"><link rel="apple-touch-icon" href="assets/logo.jpg">
<title>Aide & guide · El Wakil Immobilier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/app.css">
<style>
  html { scroll-behavior: smooth; }
  .toc a.on { background: #fff; color: #0f172a; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
  details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  mark { background: #fef08a; color: inherit; border-radius: 2px; padding: 0 1px; }
</style>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
</head>
<body>
<div id="page">
  <!-- Hero -->
  <div class="rounded-2xl bg-gradient-to-br from-night-900 via-night-800 to-brand-900 text-white p-8 lg:p-10 relative overflow-hidden">
    <div class="absolute inset-0 opacity-[.06]" style="background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 40px 40px;"></div>
    <div class="relative max-w-3xl">
      <span class="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-xs text-brand-100"><i data-lucide="life-buoy" class="w-3.5 h-3.5"></i> Centre d'aide</span>
      <h1 class="mt-4 text-3xl font-semibold tracking-tight">Comment pouvons-nous vous aider ?</h1>
      <p class="mt-2 text-slate-300">Tout ce qu'il faut savoir pour utiliser l'application : chaque écran, chaque rôle et chaque calcul expliqués simplement.</p>
      <div class="mt-6 relative">
        <i data-lucide="search" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input id="hq" class="w-full rounded-xl border-0 bg-white py-3.5 pl-12 pr-4 text-[15px] text-slate-900 placeholder:text-slate-400 shadow-xl focus:outline-none focus:ring-4 focus:ring-brand-400/30" placeholder="Ex. « ajouter un client », « salaire », « masquer les numéros »…">
      </div>
      <div class="mt-4 flex flex-wrap gap-2 text-sm" id="quick"></div>
    </div>
  </div>

  <div class="mt-8 grid grid-cols-1 lg:grid-cols-[240px_1fr] gap-8 items-start">
    <nav class="toc lg:sticky lg:top-24 space-y-0.5 text-sm max-h-[calc(100vh-7rem)] overflow-y-auto thin-scroll pr-1" id="toc"></nav>
    <div id="content" class="space-y-6 min-w-0"></div>
  </div>
  <p id="noRes" class="hidden mt-10 text-center text-slate-500">Aucun résultat. Essayez un autre mot, ou consultez la FAQ.</p>
</div>

<script>
WK.mount({ id: 'aide', title: 'Aide & guide', section: 'Aide' }, () => {
  const { $, $$, can, roles, PERMISSIONS, ALL_PERMS, settings, fmt, icon, esc, currentRole, badge, permLabel } = WK;
  const s = settings();
  const kbd = k => `<kbd class="rounded border border-slate-200 bg-slate-50 px-1.5 py-0.5 text-xs font-medium text-slate-600">${k}</kbd>`;
  const tip = (t, tone = 'brand') => `<div class="mt-4 rounded-xl ${tone === 'amber' ? 'bg-amber-50 ring-amber-200 text-amber-900' : 'bg-brand-50 ring-brand-100 text-brand-900'} ring-1 p-4 text-sm flex gap-3">${icon(tone === 'amber' ? 'alert-triangle' : 'lightbulb', 'w-4 h-4 shrink-0 mt-0.5')}<div>${t}</div></div>`;
  const steps = L => `<ol class="mt-4 space-y-3">${L.map((x, i) => `<li class="flex gap-3"><span class="w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-semibold flex items-center justify-center shrink-0">${i + 1}</span><span class="text-sm text-slate-700 leading-relaxed pt-0.5">${x}</span></li>`).join('')}</ol>`;
  const list = L => `<ul class="mt-3 space-y-2">${L.map(x => `<li class="flex gap-2.5 text-sm text-slate-700 leading-relaxed"><span class="mt-2 w-1.5 h-1.5 rounded-full bg-brand-500 shrink-0"></span><span>${x}</span></li>`).join('')}</ul>`;
  const h = t => `<h3 class="mt-6 text-sm font-semibold text-slate-900">${t}</h3>`;

  const MODULES = [
    { id: 'intro', group: 'Démarrer', icon: 'sparkles', title: 'Bienvenue', body: `
      <p class="text-[15px] text-slate-700 leading-relaxed">Cette application remplace le fichier Excel de l'agence. Chaque rendez-vous, client, mission ou versement est saisi <b>une seule fois</b> ; les salaires, primes, frais, statistiques et la rentabilité se calculent ensuite <b>automatiquement</b>.</p>
      <div class="mt-5 grid sm:grid-cols-3 gap-3">${[['shield-check', 'Chacun voit ce qui le concerne', 'Les montants financiers ne sont visibles que par les rôles autorisés.'], ['calculator', 'Zéro formule', 'Plus de lignes oubliées ni de formules cassées : tout est recalculé à chaque saisie.'], ['smartphone', 'Partout', 'Utilisable sur ordinateur, tablette et téléphone.']].map(([ic, t, d]) => `<div class="rounded-xl ring-1 ring-slate-200 p-4"><span class="w-8 h-8 rounded-lg bg-brand-50 text-brand-700 flex items-center justify-center">${icon(ic)}</span><p class="mt-3 text-sm font-semibold text-slate-900">${t}</p><p class="text-xs text-slate-500 mt-1">${d}</p></div>`).join('')}</div>
      ${h('Les grands espaces de l\'application')}
      ${list(['<b>Opérations</b> : tableau de bord, rendez-vous, équipe terrain, encaissements CCP.', '<b>Commercial</b> : « Mon espace » pour chaque vendeur et le fichier <b>Clients (CRM)</b>.', '<b>Finance</b> : performance des agents, sponsoring, paie, rentabilité.', '<b>Clients</b> : résultats des enquêtes de satisfaction.', '<b>Administration</b> : utilisateurs, rôles, permissions et règles de calcul.'])}` },

    { id: 'demarrage', group: 'Démarrer', icon: 'rocket', title: 'Premiers pas', body: `
      ${h('Se connecter')}${steps(['Ouvrez l\'adresse de l\'application et saisissez votre e-mail (ou téléphone) et votre mot de passe.', 'Cochez « Rester connecté » uniquement sur un appareil personnel.', 'Mot de passe oublié ? Cliquez sur le lien sous le champ : un lien de réinitialisation vous est envoyé par e-mail.'])}
      ${h('Se repérer')}${list([`Le <b>menu de gauche</b> n'affiche que les pages auxquelles votre rôle donne accès.`, `La <b>barre de recherche</b> en haut (raccourci ${kbd('Ctrl')} + ${kbd('K')}) retrouve un bien, une commune ou un agent dans les rendez-vous.`, `La <b>cloche</b> regroupe les alertes : relances en retard, missions à valider, paie à clôturer…`, `Le bouton ${icon('circle-help', 'w-4 h-4 inline -mt-0.5')} ouvre directement l'aide de la page où vous êtes.`, `${kbd('Échap')} ferme une fenêtre ou un panneau ouvert.`])}
      ${h('Sur téléphone')}${list([`La <b>barre en bas de l'écran</b> donne accès en un geste à l'accueil, aux rendez-vous, aux clients et au menu complet.`, `Le bouton doré ${icon('plus', 'w-4 h-4 inline -mt-0.5')} ouvre la <b>recherche</b> et les <b>actions rapides</b> : nouveau rendez-vous, nouveau client, mission, versement CCP.`, `Les listes s'affichent en <b>cartes</b> faciles à lire ; touchez une carte pour ouvrir le détail.`, `Les filtres sont regroupés derrière le bouton ${icon('sliders-horizontal', 'w-4 h-4 inline -mt-0.5')} pour garder l'écran dégagé.`, `Les formulaires s'ouvrent depuis le bas de l'écran, à portée de pouce. Ajoutez l'application à l'écran d'accueil de votre téléphone pour l'ouvrir comme une application.`])}
      ${tip('<b>Mode démonstration</b> : le bouton jaune « Aperçu : … » permet de voir l\'application avec les yeux de chaque rôle. Il n\'existe pas dans la version finale.', 'amber')}` },

    { id: 'roles', group: 'Démarrer', icon: 'users-round', title: 'Qui voit quoi ?', body: `
      <p class="text-sm text-slate-700 leading-relaxed">Chaque utilisateur a <b>un rôle</b>, et chaque rôle est un ensemble de <b>permissions</b>. Votre rôle actuel : ${badge(currentRole().nom, currentRole().color)}. Les rôles ci-dessous sont modifiables dans <a class="text-brand-700 underline" href="utilisateurs.html#roles">Utilisateurs & rôles</a>.</p>
      <div class="mt-5 grid sm:grid-cols-2 gap-3" id="roleCards"></div>
      ${h('Résumé des accès')}
      <div class="mt-3 overflow-x-auto rounded-xl ring-1 ring-slate-200"><table class="tbl" id="roleMatrix"></table></div>` },

    { id: 'dashboard', group: 'Opérations', icon: 'layout-dashboard', title: 'Tableau de bord', href: 'dashboard.html', perm: 'dashboard.view', body: `
      <p class="text-sm text-slate-700 leading-relaxed">La vue d'ensemble de l'agence pour le mois choisi. Le contenu s'adapte au rôle : <b>chiffres financiers</b> pour la direction et la comptabilité, <b>indicateurs d'activité</b> pour les autres.</p>
      ${h('Ce que vous y trouvez')}${list(['Les indicateurs du mois (CA, nombre de RDV, résultat net, revenu moyen) comparés à la <b>même période</b> du mois précédent : quand le mois est en cours, on compare du 1er au même jour.', 'L\'évolution sur 12 mois : cliquez sur une barre pour afficher ce mois.', 'La répartition par type de bien et par wilaya, le classement des commerciaux et l\'activité de l\'équipe terrain.', 'Les derniers rendez-vous saisis.'])}
      ${tip('Utilisez le sélecteur de mois en haut à droite pour revenir sur n\'importe quel mois passé.')}` },

    { id: 'rdv', group: 'Opérations', icon: 'calendar-check', title: 'Rendez-vous', href: 'rdv.html', perm: 'rdv.view', body: `
      <p class="text-sm text-slate-700 leading-relaxed">Toutes les visites programmées par les commerciaux et réalisées par l'équipe terrain. C'est la base de tous les calculs (primes, charges, chiffre d'affaires).</p>
      ${h('Ajouter un rendez-vous')}${steps(['Cliquez sur <b>Nouveau rendez-vous</b>.', 'Choisissez la date, la wilaya, le type de bien (icônes) et saisissez la commune : les communes déjà utilisées sont proposées.', 'Sélectionnez le <b>commercial</b> et le <b>photographe</b> dans les listes. Les noms ne se tapent plus, donc plus de fautes.', 'Indiquez le revenu et le mode de paiement (espèces, CCP, virement), puis <b>Créer le rendez-vous</b>.'])}
      ${h('Retrouver et exporter')}${list(['Filtrez par mois, commercial, photographe, type ou wilaya ; triez par date ou par revenu.', 'Cliquez sur une ligne pour voir le détail et l\'historique, ou pour modifier / supprimer (selon vos droits).', '<b>Exporter</b> télécharge la liste filtrée en fichier compatible Excel.'])}
      ${tip('Un RDV dont le revenu est vide est marqué « À compléter » : pensez à le renseigner une fois encaissé. Les commerciaux voient d\'abord leurs propres RDV.')}` },

    { id: 'crm', group: 'Commercial', icon: 'contact', title: 'Clients (CRM)', href: 'crm.html', perm: 'crm.view', body: `
      <p class="text-sm text-slate-700 leading-relaxed">Le <b>fichier clients partagé</b> de l'agence : vendeurs, acheteurs, locataires et bailleurs. Chaque client a une fiche avec ses coordonnées, son projet, les informations utiles et tout l'historique des échanges.</p>
      ${h('Ajouter un client')}${steps(['Dans <b>Clients</b>, cliquez sur <b>Nouveau client</b>.', 'Choisissez le type (acheteur, vendeur…), saisissez le nom, le téléphone, le bien recherché ou proposé et le budget / prix.', 'Ajoutez une première note (ce que le client veut, ses contraintes) puis <b>Créer la fiche</b>. Pour un commercial, le client lui est automatiquement attribué.'])}
      ${h('Compléter une fiche')}${list(['<b>Historique</b> : ajoutez une note, un appel, un échange WhatsApp ou un compte rendu de visite. Tout est daté et signé.', '<b>Informations complémentaires</b> : ajoutez des éléments libres (disponibilité, financement, documents, préférences…). Les boutons « + Disponibilité », « + Financement »… pré-remplissent l\'intitulé.', '<b>Relance</b> : programmez la prochaine action et sa date. Elle apparaît dans « Mon espace », dans la cloche et en tête de la liste des clients. Cliquez sur <b>Fait</b> une fois la relance effectuée.', '<b>Température</b> (chaud / tiède / froid) : cliquez sur la pastille à côté du nom pour la changer.'])}
      ${h('Le pipeline')}<p class="mt-2 text-sm text-slate-700 leading-relaxed">Chaque client avance par étapes : <b>Nouveau → Contacté → Visite programmée → Négociation → Gagné</b> (ou Perdu). Changez l'étape en cliquant sur la barre de progression de la fiche, ou basculez la liste en vue <b>Pipeline</b> ${icon('columns-3', 'w-4 h-4 inline -mt-0.5')} et <b>glissez-déposez</b> les cartes d'une colonne à l'autre.</p>
      ${h('Confidentialité du fichier')}${list(['Un commercial voit le fichier de l\'agence mais <b>ne peut faire avancer que ses propres clients</b>.', 'Les <b>numéros de téléphone et e-mails</b> des clients des autres commerciaux sont <b>masqués</b> (permission « Voir tous les numéros »).', 'L\'<b>export</b> du fichier est réservé aux rôles autorisés : la base ne peut pas être copiée par un commercial qui quitte l\'agence.', 'Un responsable peut <b>réattribuer</b> un client à un autre commercial depuis la fiche.'])}` },

    { id: 'espace', group: 'Commercial', icon: 'user-round', title: 'Mon espace (commerciaux)', href: 'espace.html', perm: 'espace.view', body: `
      <p class="text-sm text-slate-700 leading-relaxed">La page d'accueil de chaque vendeur. Elle ne montre <b>que ses propres chiffres</b>, jamais ceux de l'agence.</p>
      ${list(['<b>Objectif du mois</b> : nombre de RDV réalisés sur l\'objectif, et ce que chaque RDV supplémentaire rapporte.', '<b>Rémunération estimée</b> : salaire fixe + primes, mise à jour à chaque rendez-vous.', '<b>Mes relances</b> : les clients à rappeler, les retards en rouge.', '<b>Mon pipeline</b>, mes derniers RDV, mon historique et mon classement dans l\'équipe.'])}
      ${tip('Pour créer un compte vendeur : <b>Utilisateurs & rôles → Inviter un utilisateur</b>, choisissez le rôle <b>Commercial</b>, puis la <b>fiche commerciale liée</b> (le nom utilisé dans les rendez-vous).')}` },

    { id: 'missions', group: 'Opérations', icon: 'map-pinned', title: 'Équipe terrain', href: 'missions.html', perm: 'missions.view', body: `
      <p class="text-sm text-slate-700 leading-relaxed">Le suivi des photographes : visites, missions hors wilaya, frais et planning de repos.</p>
      ${list([`<b>Détection automatique</b> : quand un RDV a lieu hors des wilayas de base (${s.wilayasBase.join(', ')}), une mission est créée « À valider » avec les frais pré-calculés selon le barème.`, '<b>Valider</b> une mission l\'ajoute à la paie du photographe. « Tout valider » traite toutes les missions détectées d\'un coup.', '<b>Déclarer une mission</b> : pour un déplacement non lié à un RDV, avec le calcul automatique des frais.', '<b>Planning</b> : cliquez sur une case pour passer un jour de « Travail » à « Repos ».'])}
      ${h('Ajuster les frais d\'une seule mission')}${steps(['Dans le tableau des missions, cliquez sur le crayon ' + icon('pencil', 'w-4 h-4 inline -mt-0.5') + ' de la ligne concernée (permission « Modifier les frais d\'une mission »).', 'Corrigez les montants de repas, de frais ou d\'hôtel : le barème de référence est rappelé sous chaque champ et l\'écart s\'affiche en direct.', 'Indiquez le <b>motif</b> (obligatoire), puis Enregistrer. La mission porte la mention « Ajusté » avec l\'ancien montant barré, et la paie est mise à jour.'])}
      ${tip('Le barème général n\'est pas touché : seule cette mission change. Une fois la paie du mois validée, les frais sont verrouillés ' + icon('lock', 'w-3.5 h-3.5 inline -mt-0.5') + '. Chaque ajustement est inscrit dans le journal d\'activité.')}` },

    { id: 'encaissements', group: 'Opérations', icon: 'wallet', title: 'Encaissements CCP', href: 'encaissements.html', perm: 'encaissements.view', body: `
      <p class="text-sm text-slate-700 leading-relaxed">Les versements reçus sur le compte CCP de l'agence.</p>
      ${list(['<b>Nouveau versement</b> : date, montant, objet (bien concerné) et photo du reçu.', '<b>Rapprochement automatique</b> : un versement est relié au RDV dont le lieu correspond, à 5 jours près. Les versements non reliés sont marqués « À rapprocher ».', 'Le graphique montre le total encaissé par mois.'])}` },

    { id: 'agents', group: 'Finance', icon: 'trophy', title: 'Performance des agents', href: 'agents.html', perm: 'agents.view', body: `
      <p class="text-sm text-slate-700 leading-relaxed">Ce que chaque commercial rapporte réellement à l'agence, une fois tous ses coûts déduits.</p>
      ${list(['Comparaison <b>commerciaux internes</b> / <b>agents WhatsApp</b> sponsorisés.', 'Alerte automatique quand des agents sponsorisés n\'ont apporté <b>aucun RDV</b>.', 'Cliquez sur un agent pour voir son historique sur 12 mois et le détail du calcul.'])}
      ${tip('Le détail des formules est dans la section <a href="#calculs" class="underline font-medium">Règles de calcul</a>.')}` },

    { id: 'sponsoring', group: 'Finance', icon: 'megaphone', title: 'Sponsoring', href: 'sponsoring.html', perm: 'sponsoring.view', body: `
      ${steps(['Choisissez le mois.', 'Saisissez le montant dépensé <b>en dollars</b> pour chaque agent : le coût en dinars, le coût par RDV, le net et le ROI se recalculent instantanément.', 'Ajustez si besoin le taux du dollar et les frais de carte, puis <b>Enregistrer les budgets</b>.'])}
      ${list(['<b>Verdicts</b> : « Rentable », « À surveiller » (des RDV mais un coût trop élevé) et « Suspendre » (budget dépensé sans aucun RDV).', 'Les <b>recommandations</b> chiffrent l\'économie possible sur un mois et sur un an.'])}` },

    { id: 'paie', group: 'Finance', icon: 'banknote', title: 'Paie', href: 'paie.html', perm: 'paie.view', body: `
      ${list(['Deux onglets : <b>Commerciaux</b> (fixe + primes + bonus) et <b>Équipe terrain</b> (salaire de base + missions validées).', 'Tant que la paie est en <b>Brouillon</b>, elle se met à jour à chaque nouveau RDV ou mission.', '<b>Valider la paie</b> fige les montants du mois : l\'action est tracée dans le journal.', '<b>Fiche</b> ouvre la fiche de paie individuelle, imprimable ou enregistrable en PDF.'])}` },

    { id: 'rentabilite', group: 'Finance', icon: 'line-chart', title: 'Rentabilité', href: 'rentabilite.html', perm: 'rentabilite.view', body: `
      ${list(['<b>Exercice précédent</b> : chiffre d\'affaires, dépenses, bénéfice et marge mois par mois.', '<b>Exercice en cours (estimé)</b> : calculé automatiquement à partir des RDV (charges, salaires commerciaux, sponsoring).', 'Survolez les graphiques pour le détail ; exportez le tableau en un clic.'])}` },

    { id: 'enquetes', group: 'Clients', icon: 'message-square-heart', title: 'Enquêtes clients', href: 'enquetes.html', perm: 'enquetes.view', body: `
      ${list(['Deux questionnaires : <b>clients vendeurs</b> et <b>membres de la plateforme</b>.', 'Chaque question affiche la traduction française et la question d\'origine en arabe.', '<b>Envoyer l\'enquête</b> génère un lien à partager par WhatsApp, avec la possibilité de l\'envoyer automatiquement après chaque vente.'])}` },

    { id: 'utilisateurs', group: 'Administration', icon: 'shield-check', title: 'Utilisateurs & rôles', href: 'utilisateurs.html', perm: 'users.manage', body: `
      ${h('Inviter quelqu\'un')}${steps(['<b>Utilisateurs & rôles → Inviter un utilisateur</b>.', 'Saisissez le nom, l\'e-mail et le téléphone, puis choisissez un rôle : le résumé indique ce qu\'il pourra voir.', 'Pour un vendeur, choisissez le rôle <b>Commercial</b> et la fiche commerciale liée.', 'La personne reçoit une invitation et choisit son mot de passe.'])}
      ${h('Créer ou modifier un rôle')}${steps(['Onglet <b>Rôles & permissions</b>, puis <b>Nouveau rôle</b> (en partant d\'un rôle existant si vous voulez).', 'Activez / désactivez chaque permission avec les interrupteurs. « Tout autoriser » agit sur un groupe entier.', 'Le changement s\'applique <b>immédiatement</b> à tous les utilisateurs du rôle. « Voir l\'app avec ce rôle » permet de vérifier le résultat.'])}
      ${list(['<b>Suspendre</b> un utilisateur bloque son accès sans perdre son historique.', 'Le rôle <b>Propriétaire</b> ne peut être ni modifié ni supprimé : vous ne pouvez jamais perdre l\'accès à votre agence.', 'Le <b>journal d\'activité</b> garde la trace de qui a fait quoi, et quand ; il n\'est pas modifiable.', '« Comparer les rôles » affiche toutes les permissions côte à côte.'])}` },

    { id: 'parametres', group: 'Administration', icon: 'settings-2', title: 'Paramètres', href: 'parametres.html', perm: 'settings.manage', body: `
      ${list(['Modifiez les <b>règles de calcul</b> (primes, charges, taux du dollar, barème des frais) : tous les écrans sont recalculés.', 'Gérez l\'<b>équipe</b> : ajoutez un commercial ou un photographe, changez son type ou son salaire, désactivez un ancien membre (son historique est conservé).', 'Choisissez les <b>wilayas de base</b> (sans frais de mission).', 'Exportez toutes les données (même format que le modèle) et consultez les sauvegardes.'])}
      ${h('Importer depuis Excel')}${steps(['Dans <b>Paramètres → Données</b>, cliquez sur <b>Modèle Excel (.xlsx)</b> pour télécharger le modèle.', 'Remplissez les onglets <b>Rendez-vous</b>, <b>Clients</b>, <b>Versements CCP</b> et/ou <b>Missions</b> sans modifier les titres de colonnes. Les noms, types, wilayas et sources se choisissent dans des listes déroulantes ; les colonnes en jaune (*) sont obligatoires.', 'Cliquez sur <b>Importer un fichier</b> : chaque ligne est vérifiée (champs obligatoires, noms reconnus, dates JJ/MM/AAAA, montants entiers en DA).', 'Consultez le rapport : les erreurs sont listées par onglet, ligne et colonne. Seules les lignes correctes sont importées ; corrigez les autres dans Excel puis réimportez.'])}
      ${tip('Un fichier qui ne suit pas le modèle (colonnes renommées, onglet manquant) est refusé avant tout import : vos données restent propres. L\'onglet « Lisez-moi » du modèle rappelle toutes les règles.')}
      ${tip('Une valeur modifiée par rapport à l\'ancien fichier Excel est signalée sous le champ.', 'amber')}` },

    { id: 'calculs', group: 'Référence', icon: 'calculator', title: 'Règles de calcul', body: `
      <div class="mb-5 rounded-xl ring-1 ring-slate-200 p-4 flex gap-4 items-start"><span class="w-9 h-9 rounded-lg bg-brand-50 text-brand-700 flex items-center justify-center shrink-0">${icon('banknote')}</span><div class="text-sm text-slate-700 leading-relaxed"><p class="font-semibold text-slate-900">Comment les montants sont affichés</p><p class="mt-1">Tous les montants sont en <b>dinars algériens (DA)</b>, affichés en entier : <span class="font-mono bg-slate-50 rounded px-1.5 py-0.5 tnum">${fmt.da(2150000)}</span>. Les chiffres sont groupés par milliers pour une lecture facile, <b>sans abréviation</b> (pas de « k » ni de « M ») et <b>sans décimales</b> : le dinar ne se divise pas, tous les calculs sont arrondis au dinar près.</p></div></div>
      <p class="text-sm text-slate-700">Valeurs actuellement en vigueur (modifiables dans <a href="parametres.html" class="text-brand-700 underline">Paramètres</a>) :</p>
      <div class="mt-4 space-y-3">${[
        ['Salaire commercial interne', `Fixe + ${fmt.n(s.primeRdv)} DA × nombre de RDV`],
        ['Salaire agent WhatsApp', `${fmt.n(s.primeRdv + s.bonusWhatsapp)} DA × nombre de RDV (prime ${fmt.n(s.primeRdv)} + bonus ${fmt.n(s.bonusWhatsapp)})`],
        ['Charge terrain', `${fmt.n(s.chargeRdv)} DA par RDV (transport, carburant, photographe)`],
        ['Coût du sponsoring', `Montant en $ × ${(1 + s.fraisSponsoring / 100).toLocaleString('fr-FR')} (frais ${s.fraisSponsoring} %) × ${s.tauxUSD} DA`],
        ['Résultat net d\'un agent', 'CA de ses RDV − charges terrain − son salaire − son sponsoring'],
        ['ROI sponsoring', 'Résultat net ÷ coût du sponsoring'],
        ['Frais de mission', `Nuitée ${fmt.n(s.fraisNuitee)} DA/jour + hôtel ${fmt.n(s.hotel)} DA/nuit · aller-retour ${fmt.n(s.fraisJournee)} DA/jour · repas ${fmt.n(s.repas)} DA`],
        ['Salaire photographe', 'Salaire de base + frais des missions validées'],
      ].map(([k, v]) => `<div class="rounded-xl ring-1 ring-slate-200 p-4 flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-6"><p class="sm:w-56 shrink-0 text-sm font-medium text-slate-900">${k}</p><p class="text-sm text-slate-600 font-mono bg-slate-50 rounded-md px-2.5 py-1.5">${v}</p></div>`).join('')}</div>` },

    { id: 'securite', group: 'Référence', icon: 'lock', title: 'Sécurité & confidentialité', body: `
      ${list(['Connexion personnelle pour chaque utilisateur : plus de fichier partagé qui circule.', '<b>Double authentification</b> obligatoire pour les rôles ayant accès aux finances.', 'Déconnexion automatique après 30 minutes d\'inactivité ; alerte <b>par e-mail</b> au propriétaire en cas de connexion depuis un nouvel appareil.', 'Numéros des clients masqués entre commerciaux ; export du fichier clients réservé.', 'Sauvegarde automatique chaque nuit ; journal d\'activité non modifiable.'])}` },

    { id: 'faq', group: 'Référence', icon: 'messages-square', title: 'Questions fréquentes', body: `<div class="space-y-2">${[
      ['L\'employée de saisie peut-elle voir les salaires ou le sponsoring ?', 'Non. Le rôle « Agent de saisie » n\'a pas la permission « Voir les montants financiers » : les pages Finance n\'apparaissent pas dans son menu et sont bloquées si elle tente d\'y accéder.'],
      ['Un commercial peut-il voir les clients des autres ?', 'Il voit le fichier de l\'agence (pour éviter les doublons et partager les infos), mais les numéros de téléphone des clients des autres sont masqués et il ne peut faire avancer que ses propres clients. Vous pouvez aussi désactiver « Voir les clients de toute l\'agence » pour qu\'il ne voie que les siens.'],
      ['Je me suis trompé dans un rendez-vous, comment corriger ?', 'Ouvrez le rendez-vous (clic sur la ligne) puis « Modifier ». Les primes, salaires et statistiques sont recalculés automatiquement. La modification est enregistrée dans le journal.'],
      ['Comment donner accès à une nouvelle personne ?', 'Utilisateurs & rôles → Inviter un utilisateur → choisir le rôle. Elle reçoit une invitation par e-mail.'],
      ['Un employé quitte l\'agence, que faire ?', 'Suspendez son compte (son historique reste intact), puis réattribuez ses clients à un autre commercial depuis leurs fiches.'],
      ['Le taux du dollar a changé, que faire ?', 'Paramètres → Charges & sponsoring → Taux du dollar. Tous les coûts de sponsoring et ROI sont recalculés.'],
      ['Que devient mon fichier Excel ?', 'Il est importé une fois (Paramètres → Données). Ensuite, tout se fait dans l\'application ; vous pouvez exporter les données en Excel à tout moment.'],
      ['Puis-je utiliser l\'application sur mon téléphone ?', 'Oui, toutes les pages s\'adaptent aux écrans de téléphone et de tablette.'],
    ].map(([q, a]) => `<details class="group rounded-xl ring-1 ring-slate-200 bg-white"><summary class="flex items-center justify-between gap-4 cursor-pointer px-4 py-3.5 text-sm font-medium text-slate-900">${q}<span class="chev transition text-slate-400">${icon('chevron-down', 'w-4 h-4')}</span></summary><p class="px-4 pb-4 text-sm text-slate-600 leading-relaxed">${a}</p></details>`).join('')}</div>` },

    { id: 'glossaire', group: 'Référence', icon: 'book-open', title: 'Glossaire', body: `<dl class="grid sm:grid-cols-2 gap-x-8">${[
      ['RDV', 'Rendez-vous de visite d\'un bien, apporté par un commercial et réalisé par un photographe.'], ['Commercial interne', 'Vendeur salarié avec un fixe mensuel et une prime par RDV.'],
      ['Agent WhatsApp', 'Vendeur sans fixe, payé au RDV, dont l\'activité est soutenue par un budget publicitaire.'], ['Sponsoring', 'Budget publicitaire (en dollars) dépensé pour un agent.'],
      ['ROI', 'Retour sur investissement : ce que rapporte 1 DA dépensé en sponsoring.'], ['Pipeline', 'Les étapes successives d\'un client, de « Nouveau » à « Gagné » ou « Perdu ».'],
      ['Relance', 'Prochaine action prévue avec un client, à une date donnée.'], ['Température', 'Niveau d\'intérêt d\'un client : chaud, tiède ou froid.'],
      ['Mission hors wilaya', 'Déplacement d\'un photographe hors des wilayas de base, qui donne droit à des frais.'], ['Rapprochement', 'Lien entre un versement CCP et le rendez-vous correspondant.'],
      ['Rôle', 'Ensemble de permissions attribué à un utilisateur.'], ['Journal d\'activité', 'Historique non modifiable de toutes les actions importantes.'],
    ].map(([k, v]) => `<div class="py-3 border-b border-slate-100"><dt class="text-sm font-semibold text-slate-900">${k}</dt><dd class="text-sm text-slate-600 mt-0.5">${v}</dd></div>`).join('')}</dl>` },

    { id: 'contact', group: 'Référence', icon: 'headset', title: 'Besoin d\'aide supplémentaire ?', body: `
      <div class="grid sm:grid-cols-3 gap-3">${[['message-circle', 'WhatsApp', 'Réponse en moins de 2 h, 7j/7'], ['mail', 'E-mail', 'Pour les demandes détaillées'], ['video', 'Formation', 'Session de prise en main pour votre équipe']].map(([ic, t, d]) => `<div class="rounded-xl ring-1 ring-slate-200 p-4"><span class="w-9 h-9 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">${icon(ic)}</span><p class="mt-3 text-sm font-semibold text-slate-900">${t}</p><p class="text-xs text-slate-500 mt-0.5">${d}</p></div>`).join('')}</div>
      <p class="mt-4 text-sm text-slate-600">Pour une question d'accès (mot de passe, droits), contactez d'abord l'administrateur de votre agence.</p>` },
  ];

  // Render
  const groups = [...new Set(MODULES.map(m => m.group))];
  $('#toc').innerHTML = groups.map(g => `<p class="px-3 pt-4 first:pt-0 pb-1.5 text-2xs font-semibold uppercase tracking-wider text-slate-400">${g}</p>` + MODULES.filter(m => m.group === g).map(m => `<a href="#${m.id}" data-toc="${m.id}" class="flex items-center gap-2 rounded-lg px-3 py-1.5 text-slate-600 hover:bg-white hover:text-slate-900">${icon(m.icon, 'w-4 h-4')}<span class="flex-1">${m.title}</span>${m.perm && !can(m.perm) ? icon('lock', 'w-3 h-3 text-slate-300') : ''}</a>`).join('')).join('');
  $('#content').innerHTML = MODULES.map(m => `
    <section id="${m.id}" data-sec class="card p-6 lg:p-8 scroll-mt-24">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-brand-50 text-brand-700 flex items-center justify-center">${icon(m.icon, 'w-5 h-5')}</span><div><p class="text-2xs font-semibold uppercase tracking-wider text-slate-400">${m.group}</p><h2 class="text-lg font-semibold tracking-tight text-slate-900">${m.title}</h2></div></div>
        <div class="flex flex-wrap items-center gap-2">${m.perm ? `<span class="text-xs rounded-md px-2 py-1 ${can(m.perm) ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'} inline-flex items-center gap-1">${icon(can(m.perm) ? 'check' : 'lock', 'w-3 h-3')}${can(m.perm) ? 'Accessible avec votre rôle' : 'Nécessite : ' + esc(permLabel(m.perm))}</span>` : ''}${m.href && can(m.perm) ? `<a href="${m.href}" class="btn btn-secondary !py-1.5 !text-xs">Ouvrir ${icon('arrow-up-right', 'w-3.5 h-3.5')}</a>` : ''}</div>
      </div>
      <div class="mt-4 sec-body">${m.body}</div>
    </section>`).join('');

  // Roles cards & matrix
  const R = roles();
  const KEY = [['dashboard.view', 'Tableau de bord'], ['finance.view', 'Montants financiers'], ['rdv.create', 'Saisir des RDV'], ['crm.view', 'Fichier clients'], ['crm.phone', 'Tous les numéros'], ['crm.export', 'Exporter les clients'], ['espace.view', 'Mon espace'], ['paie.validate', 'Valider la paie'], ['users.manage', 'Gérer les accès']];
  $('#roleCards').innerHTML = R.map(r => `<div class="rounded-xl ring-1 ring-slate-200 p-4"><div class="flex items-center justify-between">${badge(r.nom, r.color, r.system ? 'crown' : null)}<span class="text-2xs text-slate-400">${r.perms.length}/${ALL_PERMS.length} permissions</span></div><p class="text-sm text-slate-600 mt-2">${esc(r.desc)}</p></div>`).join('');
  $('#roleMatrix').innerHTML = `<thead><tr><th class="min-w-[170px]">Accès</th>${R.map(r => `<th class="text-center !whitespace-normal !text-2xs leading-tight">${esc(r.nom)}</th>`).join('')}</tr></thead><tbody>${KEY.map(([k, l]) => `<tr><td class="text-sm whitespace-nowrap">${l}</td>${R.map(r => `<td class="text-center">${r.perms.includes(k) ? `<span class="inline-flex w-5 h-5 rounded-full bg-emerald-50 text-emerald-600 items-center justify-center">${icon('check', 'w-3 h-3')}</span>` : `<span class="text-slate-300">${icon('minus', 'w-3.5 h-3.5 inline')}</span>`}</td>`).join('')}</tr>`).join('')}</tbody>`;

  // Quick links
  const Q = [['Ajouter un client', 'crm'], ['Créer un compte vendeur', 'espace'], ['Donner un accès', 'utilisateurs'], ['Comment est calculé le salaire ?', 'calculs'], ['Qui voit les finances ?', 'roles']];
  $('#quick').innerHTML = Q.map(([t, id]) => `<a href="#${id}" class="rounded-full bg-white/10 hover:bg-white/20 px-3 py-1.5 text-slate-100">${t}</a>`).join('');

  // Scroll spy
  const obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) $$('[data-toc]').forEach(a => a.classList.toggle('on', a.dataset.toc === e.target.id)); }), { rootMargin: '-30% 0px -60% 0px' });
  $$('[data-sec]').forEach(s => obs.observe(s));

  // Search
  const originals = new Map($$('.sec-body').map(b => [b, b.innerHTML]));
  $('#hq').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase(); let shown = 0;
    $$('[data-sec]').forEach(sec => {
      const body = $('.sec-body', sec); body.innerHTML = originals.get(body);
      const hit = !q || sec.textContent.toLowerCase().includes(q);
      sec.classList.toggle('hidden', !hit); $(`[data-toc="${sec.id}"]`).classList.toggle('opacity-30', !hit);
      if (hit) { shown++; if (q.length > 2) { $$('details', sec).forEach(d => { if (d.textContent.toLowerCase().includes(q)) d.open = true; }); markText(body, q); } }
    });
    $('#noRes').classList.toggle('hidden', shown > 0);
    WK.refreshIcons();
  });
  function markText(el, q) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => { const i = n.nodeValue.toLowerCase().indexOf(q); if (i < 0) return; const m = document.createElement('mark'); const r = document.createRange(); r.setStart(n, i); r.setEnd(n, i + q.length); r.surroundContents(m); });
  }
  if (location.hash) setTimeout(() => { const t = document.querySelector(location.hash); t && t.scrollIntoView(); }, 50);
});
</script>
</body>
</html>
