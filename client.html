<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="assets/logo.jpg"><link rel="apple-touch-icon" href="assets/logo.jpg">
<title>Fiche client · El Wakil Immobilier</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><script src="assets/tw.js"></script>
<link rel="stylesheet" href="assets/app.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
</head>
<body>
<div id="page"><div id="root"></div></div>

<script>
WK.mount({ id: 'crm', title: 'Fiche client', section: 'Clients (CRM)', perm: 'crm.view', help: 'crm' }, () => {
  const { $, $$, fmt, can, clients, saveClients, myAgent, canSeePhone, maskPhone, canEditClient, canMoveClient, STAGES, team, rdvs, avatar, badge, icon, esc, toast, audit, currentUser, TODAY, TYPE_ICON } = WK;
  const params = new URLSearchParams(location.search), id = +params.get('id');
  const me = myAgent();
  const KIND = { note: ['sticky-note', 'bg-slate-100 text-slate-600', 'Note'], appel: ['phone', 'bg-sky-50 text-sky-600', 'Appel'], whatsapp: ['message-circle', 'bg-emerald-50 text-emerald-600', 'WhatsApp'], visite: ['map-pin', 'bg-violet-50 text-violet-600', 'Visite'], statut: ['git-commit-horizontal', 'bg-amber-50 text-amber-700', 'Étape'], info: ['info', 'bg-brand-50 text-brand-700', 'Info'] };
  const PRESETS = ['Disponibilité', 'Financement', 'Documents', 'Préférences', 'Situation', 'Urgence', 'Étage souhaité', 'Orientation'];
  const TEMP = { Chaud: ['bg-red-500', 'text-red-700 bg-red-50 ring-red-200'], 'Tiède': ['bg-amber-400', 'text-amber-800 bg-amber-50 ring-amber-200'], Froid: ['bg-sky-400', 'text-sky-700 bg-sky-50 ring-sky-200'] };
  let composer = 'note';

  const get = () => clients().find(c => c.id === id);
  function update(fn, log) { const all = clients(), c = all.find(x => x.id === id); fn(c); saveClients(all); if (log) audit('Client', `${c.nom} : ${log}`); render(); }
  function addEvent(c, kind, text) { c.notes.unshift({ id: 'n' + Date.now(), kind, date: TODAY, author: currentUser().nom, text }); }

  function render() {
    const c = get();
    if (!c || (!can('crm.viewAll') && c.agent !== me)) { $('#root').innerHTML = `<div class="card p-10 text-center max-w-lg mx-auto mt-10"><p class="font-semibold">Fiche introuvable ou non accessible</p><a href="crm.html" class="btn btn-primary mt-5">${icon('arrow-left')} Retour aux clients</a></div>`; WK.refreshIcons(); return; }
    const edit = canEditClient(c), move = canMoveClient(c), phone = canSeePhone(c), own = c.agent === me;
    const si = STAGES.findIndex(s => s.id === c.statut);
    const L = rdvs().filter(r => c.rdvIds.includes(r.id));
    const isRent = c.type === 'Locataire' || c.type === 'Bailleur';
    const agents = team().commerciaux.filter(a => a.actif).map(a => a.nom);
    document.title = c.nom + ' · El Wakil Immobilier';

    $('#root').innerHTML = `
      <a href="crm.html" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-800">${icon('arrow-left')} Tous les clients</a>
      ${params.get('new') ? `<div class="mt-4 rounded-xl bg-emerald-50 ring-1 ring-emerald-200 p-3 text-sm text-emerald-800 flex items-center gap-2">${icon('check-circle-2')} Fiche créée. Complétez-la avec les informations utiles à l'équipe.</div>` : ''}

      <div class="card mt-4 p-6">
        <div class="flex flex-col lg:flex-row lg:items-center gap-5">
          <div class="flex items-center gap-4 flex-1 min-w-0">
            ${avatar(c.nom, 'w-14 h-14 text-lg')}
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2"><h1 class="text-xl font-semibold tracking-tight text-slate-900">${esc(c.nom)}</h1>${badge(c.type, { Vendeur: 'blue', Acheteur: 'green', Locataire: 'violet', Bailleur: 'amber' }[c.type])}
                <button id="temp" ${edit ? '' : 'disabled'} class="inline-flex items-center gap-1.5 rounded-md px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${TEMP[c.temperature][1]}" title="Changer la température"><span class="w-1.5 h-1.5 rounded-full ${TEMP[c.temperature][0]}"></span>${c.temperature}</button></div>
              <p class="text-sm text-slate-500 mt-1">${c.bien} · ${esc(c.commune)}, ${c.wilaya} · client depuis le ${fmt.date(c.created)} · source ${c.source}</p>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            ${phone ? `<a href="tel:${c.tel.replace(/\s/g, '')}" class="btn btn-secondary">${icon('phone')} Appeler</a><a href="https://wa.me/213${c.tel.replace(/\s/g, '').slice(1)}" target="_blank" class="btn btn-secondary !text-emerald-700">${icon('message-circle')} WhatsApp</a>` : `<span class="text-xs text-slate-500 flex items-center gap-1.5 rounded-lg bg-slate-50 ring-1 ring-slate-200 px-3 py-2">${icon('lock', 'w-3.5 h-3.5')} Coordonnées réservées à ${esc(c.agent)}</span>`}
            ${can('crm.delete') ? `<button id="del" class="btn btn-danger !px-2.5" title="Supprimer">${icon('trash-2')}</button>` : ''}
          </div>
        </div>
        <!-- Pipeline -->
        <div class="mt-6 grid grid-cols-6 gap-1.5" id="stages">${STAGES.map((s, i) => { const done = i <= si && c.statut !== 'Perdu' && s.id !== 'Perdu', cur = s.id === c.statut; return `
          <button data-st="${s.id}" ${move ? '' : 'disabled'} class="group text-left ${move ? 'cursor-pointer' : 'cursor-default'}">
            <div class="h-1.5 rounded-full ${cur ? s.color : done ? 'bg-brand-300' : 'bg-slate-100'} ${move ? 'group-hover:opacity-80' : ''}"></div>
            <p class="mt-2 text-xs ${cur ? 'font-semibold text-slate-900' : 'text-slate-500'}">${s.id}</p></button>`; }).join('')}</div>
        ${!move ? `<p class="mt-3 text-2xs text-slate-400">${icon('lock', 'w-3 h-3 inline -mt-0.5')} Seul ${esc(c.agent)} (ou un responsable) peut faire avancer ce client.</p>` : ''}
      </div>

      <div class="mt-6 grid grid-cols-1 xl:grid-cols-[380px_1fr] gap-6 items-start">
        <div class="space-y-6">
          <div class="card p-5">
            <h3 class="font-semibold text-slate-900">Coordonnées</h3>
            <dl class="mt-3 text-sm divide-y divide-slate-100">
              ${[['phone', 'Téléphone', phone ? esc(c.tel) : maskPhone(c.tel) + ' ' + icon('lock', 'w-3 h-3 inline -mt-0.5 text-slate-400')], ['mail', 'E-mail', phone ? esc(c.email || '—') : (c.email ? '••••@••••' : '—')], ['map-pin', 'Localisation', esc(c.commune) + ', ' + c.wilaya], ['radar', 'Source', c.source]].map(([ic, k, v]) => `<div class="flex items-center gap-3 py-2.5"><span class="text-slate-400">${icon(ic)}</span><dt class="text-slate-500 w-24">${k}</dt><dd class="text-slate-800 font-medium tnum truncate">${v}</dd></div>`).join('')}
              <div class="flex items-center gap-3 py-2.5"><span class="text-slate-400">${icon('user-round')}</span><dt class="text-slate-500 w-24">Commercial</dt><dd class="flex-1">${can('crm.assign') ? `<select id="assign" class="field !py-1">${agents.map(a => `<option ${a === c.agent ? 'selected' : ''}>${a}</option>`).join('')}</select>` : `<span class="inline-flex items-center gap-2 font-medium text-slate-800">${avatar(c.agent, 'w-6 h-6 text-2xs')}${esc(c.agent)}${own ? ' <span class="text-2xs text-brand-700">(vous)</span>' : ''}</span>`}</dd></div>
            </dl>
          </div>

          <div class="card p-5">
            <h3 class="font-semibold text-slate-900">${c.type === 'Vendeur' || c.type === 'Bailleur' ? 'Bien proposé' : 'Recherche'}</h3>
            <div class="mt-3 grid grid-cols-2 gap-2">${[[c.type === 'Vendeur' || c.type === 'Bailleur' ? 'Prix demandé' : 'Budget', isRent ? fmt.da(c.budget) + '/mois' : fmt.da(c.budget)], ['Type', c.bien], ['Surface', c.surface ? c.surface + ' m²' : '—'], ['Pièces', c.pieces ? 'F' + c.pieces : '—']].map(([k, v]) => `<div class="rounded-lg bg-slate-50 p-3"><p class="text-2xs text-slate-500">${k}</p><p class="text-sm font-semibold text-slate-900 tnum">${v}</p></div>`).join('')}</div>
          </div>

          <div class="card p-5">
            <div class="flex items-center justify-between"><h3 class="font-semibold text-slate-900">Informations complémentaires</h3><span class="text-xs text-slate-400">${c.extras.length}</span></div>
            <p class="text-xs text-slate-500 mt-0.5">Tout ce qui aide l'équipe à mieux servir ce client.</p>
            <ul class="mt-3 space-y-2">${c.extras.map((x, i) => `<li class="group flex items-start gap-3 rounded-lg ring-1 ring-slate-200 px-3 py-2.5"><div class="flex-1 min-w-0"><p class="text-2xs font-medium uppercase tracking-wide text-slate-500">${esc(x.k)}</p><p class="text-sm text-slate-800">${esc(x.v)}</p><p class="text-2xs text-slate-400 mt-0.5">ajouté par ${esc(x.by)}</p></div>${edit ? `<button data-rmx="${i}" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500">${icon('x')}</button>` : ''}</li>`).join('') || '<li class="text-sm text-slate-400">Aucune information pour le moment.</li>'}</ul>
            ${edit ? `<form id="xf" class="mt-4 space-y-2">
              <div class="flex flex-wrap gap-1.5">${PRESETS.map(p => `<button type="button" data-preset="${p}" class="rounded-full border border-slate-200 px-2.5 py-1 text-xs text-slate-600 hover:border-brand-300 hover:text-brand-800">+ ${p}</button>`).join('')}</div>
              <div class="flex gap-2"><input name="k" class="field !w-36" placeholder="Intitulé"><input name="v" class="field" placeholder="Valeur"><button class="btn btn-secondary !px-3">${icon('plus')}</button></div></form>` : ''}
          </div>

          <div class="card p-5">
            <h3 class="font-semibold text-slate-900">Rendez-vous liés</h3>
            <ul class="mt-3 space-y-2">${L.map(r => `<li class="flex items-center gap-3 rounded-lg ring-1 ring-slate-200 p-2.5"><span class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 flex items-center justify-center">${icon(TYPE_ICON[r.type] || 'map-pin')}</span><div class="flex-1 min-w-0"><p class="text-sm font-medium text-slate-800 truncate">${esc(r.commune)} · ${r.type}</p><p class="text-xs text-slate-500">${fmt.date(r.date)} · ${esc(r.agent || '—')} / ${esc(r.terrain || '—')}</p></div></li>`).join('') || '<li class="text-sm text-slate-400">Aucun rendez-vous lié.</li>'}</ul>
            ${can('rdv.create') ? `<a href="rdv.html?new=1" class="btn btn-ghost !text-brand-800 !px-0 mt-2">${icon('calendar-plus')} Programmer une visite</a>` : ''}
          </div>
        </div>

        <div class="space-y-6">
          <div class="card p-5 ${c.relance ? (c.relance < TODAY ? 'ring-1 ring-red-200 !border-red-200' : '') : ''}">
            <div class="flex flex-wrap items-center gap-3">
              <span class="w-10 h-10 rounded-xl ${c.relance && c.relance < TODAY ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-600'} flex items-center justify-center">${icon('alarm-clock', 'w-5 h-5')}</span>
              <div class="flex-1 min-w-[200px]"><p class="text-xs text-slate-500">Prochaine relance</p>${c.relance ? `<p class="font-semibold ${c.relance < TODAY ? 'text-red-600' : 'text-slate-900'}">${fmt.weekday(c.relance)} ${fmt.date(c.relance)}${c.relance < TODAY ? ' · en retard' : c.relance === TODAY ? ' · aujourd\'hui' : ''}</p><p class="text-sm text-slate-600">${esc(c.relanceNote)}</p>` : '<p class="font-medium text-slate-500">Aucune relance programmée</p>'}</div>
              ${move && c.relance ? `<button id="done" class="btn btn-secondary">${icon('check')} Fait</button>` : ''}
            </div>
          </div>

          ${edit ? `<div class="card overflow-hidden">
            <div class="flex border-b border-slate-100 px-2 overflow-x-auto whitespace-nowrap" id="ktabs">${[['note', 'sticky-note', 'Note'], ['appel', 'phone', 'Appel'], ['whatsapp', 'message-circle', 'WhatsApp'], ['visite', 'map-pin', 'Visite'], ...(move ? [['relance', 'alarm-clock', 'Relance']] : [])].map(([k, ic, l]) => `<button data-k="${k}" class="flex items-center gap-1.5 px-3 py-3 text-sm font-medium border-b-2 ${composer === k ? 'border-brand-600 text-slate-900' : 'border-transparent text-slate-500 hover:text-slate-800'}">${icon(ic, 'w-4 h-4')}${l}</button>`).join('')}</div>
            <form id="cf" class="p-4">
              <textarea name="text" rows="3" class="field" placeholder="${{ note: 'Ajouter une note pour l\'équipe…', appel: 'Résumé de l\'appel…', whatsapp: 'Résumé de l\'échange WhatsApp…', visite: 'Compte rendu de la visite…', relance: 'Objet de la relance (ex. envoyer les photos)…' }[composer]}"></textarea>
              <div class="mt-3 flex items-center justify-between gap-3">${composer === 'relance' ? `<div class="flex flex-wrap items-center gap-2"><label class="text-sm text-slate-600">Le</label><input type="date" name="date" class="field !w-auto !py-1.5" value="${TODAY}"></div>` : '<span class="text-xs text-slate-400">Visible par toute l\'équipe ayant accès à cette fiche</span>'}
                <button class="btn btn-primary">${icon('send')} ${composer === 'relance' ? 'Programmer' : 'Ajouter'}</button></div>
            </form></div>` : `<div class="card p-4 text-sm text-slate-500 flex items-center gap-2">${icon('lock')} Lecture seule : votre rôle ne permet pas de compléter cette fiche.</div>`}

          <div class="card p-5">
            <h3 class="font-semibold text-slate-900">Historique</h3>
            <ol class="mt-4 relative">${c.notes.map((n, i) => { const k = KIND[n.kind] || KIND.note; return `
              <li class="relative flex gap-4 pb-5 ${i === c.notes.length - 1 ? '' : 'before:absolute before:left-[17px] before:top-10 before:bottom-0 before:w-px before:bg-slate-200'}">
                <span class="w-9 h-9 rounded-full ${k[1]} flex items-center justify-center shrink-0 ring-4 ring-white">${icon(k[0], 'w-4 h-4')}</span>
                <div class="flex-1 min-w-0 pt-1"><p class="text-sm text-slate-800"><b class="font-medium">${esc(n.author)}</b> <span class="text-slate-400">· ${k[2]} · ${fmt.date(n.date)}</span></p><p class="text-sm text-slate-600 mt-1 whitespace-pre-line">${esc(n.text)}</p></div>
              </li>`; }).join('') || '<li class="text-sm text-slate-400">Aucun échange enregistré.</li>'}
              <li class="relative flex gap-4"><span class="w-9 h-9 rounded-full bg-slate-50 text-slate-400 flex items-center justify-center shrink-0 ring-4 ring-white">${icon('user-plus', 'w-4 h-4')}</span><p class="text-sm text-slate-500 pt-2">Fiche créée le ${fmt.date(c.created)}</p></li></ol>
          </div>
        </div>
      </div>`;
    bind(c, edit, move);
    WK.refreshIcons();
  }

  function bind(c, edit, move) {
    $$('[data-st]').forEach(b => b.onclick = () => { if (!move || b.dataset.st === c.statut) return; const from = c.statut; update(x => { x.statut = b.dataset.st; addEvent(x, 'statut', `Étape : ${from} → ${x.statut}`); if (['Gagné', 'Perdu'].includes(x.statut)) x.relance = null; }, `${from} → ${b.dataset.st}`); toast(b.dataset.st === 'Gagné' ? 'Bravo, client gagné ! 🎉' : 'Étape mise à jour'); });
    $('#temp') && edit && ($('#temp').onclick = () => { const o = ['Chaud', 'Tiède', 'Froid']; update(x => x.temperature = o[(o.indexOf(x.temperature) + 1) % 3]); });
    $('#assign') && ($('#assign').onchange = e => { const to = e.target.value; update(x => { addEvent(x, 'info', `Client réattribué : ${x.agent} → ${to}`); x.agent = to; }, `réattribué à ${to}`); toast('Client réattribué à ' + to); });
    $('#del') && ($('#del').onclick = () => { if (!confirm(`Supprimer définitivement la fiche de ${c.nom} ?`)) return; saveClients(clients().filter(x => x.id !== id)); audit('Suppression', `Client ${c.nom}`); location.href = 'crm.html'; });
    $('#done') && ($('#done').onclick = () => { update(x => { addEvent(x, 'note', `Relance effectuée : ${x.relanceNote}`); x.relance = null; x.relanceNote = ''; }, 'relance effectuée'); toast('Relance marquée comme faite'); });
    $$('[data-rmx]').forEach(b => b.onclick = () => update(x => x.extras.splice(+b.dataset.rmx, 1)));
    const xf = $('#xf');
    if (xf) {
      $$('[data-preset]', xf).forEach(b => b.onclick = () => { xf.k.value = b.dataset.preset; xf.v.focus(); });
      xf.onsubmit = e => { e.preventDefault(); const k = xf.k.value.trim(), v = xf.v.value.trim(); if (!k || !v) return; update(x => { x.extras.push({ k, v, by: currentUser().nom }); addEvent(x, 'info', `${k} : ${v}`); }, `info ajoutée (${k})`); toast('Information ajoutée'); };
    }
    $$('#ktabs [data-k]').forEach(b => b.onclick = () => { composer = b.dataset.k; render(); $('#cf textarea').focus(); });
    const cf = $('#cf');
    if (cf) cf.onsubmit = e => {
      e.preventDefault(); const t = cf.text.value.trim(); if (!t) return cf.text.classList.add('!border-red-400');
      if (composer === 'relance') { const d = cf.date.value; update(x => { x.relance = d; x.relanceNote = t; addEvent(x, 'info', `Relance programmée le ${fmt.date(d)} : ${t}`); }, 'relance programmée'); toast('Relance programmée'); }
      else { update(x => addEvent(x, composer, t), `${composer} ajouté(e)`); toast('Ajouté à l\'historique'); }
    };
  }
  render();
});
</script>
</body>
</html>
